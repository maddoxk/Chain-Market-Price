# ==============================================================================
# Chain-Market-Price: Institutional High-Frequency Trading Kernel Sysctl Profile
# Target Architecture: AMD EPYC 9654 / Intel Xeon Platinum 8480+
# Goal: Guaranteed sub-microsecond tick processing, zero paging, zero jitter
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Network Core & Socket Memory Buffers (64MB Max Window)
# ------------------------------------------------------------------------------
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.rmem_default = 33554432
net.core.wmem_default = 33554432
net.core.optmem_max = 2048576

# TCP buffer scaling: min, default, max (64MB)
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864

# Maximum socket listen backlog and device input queue
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 250000
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 4000

# ------------------------------------------------------------------------------
# 2. Kernel Socket Low-Latency & Busy Polling
# ------------------------------------------------------------------------------
# Number of microseconds to busy-poll on socket receive (bypasses OS interrupt latency)
net.core.busy_poll = 50
net.core.busy_read = 50

# TCP Latency Optimizations
net.ipv4.tcp_low_latency = 1
net.ipv4.tcp_timestamps = 0
net.ipv4.tcp_sack = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_max_syn_backlog = 3240000

# Disable slow start after idle
net.ipv4.tcp_slow_start_after_idle = 0

# ------------------------------------------------------------------------------
# 3. Virtual Memory, Swapping & HugePages
# ------------------------------------------------------------------------------
# Completely eliminate swapping out hot process pages
vm.swappiness = 0

# Aggressive background writeback to prevent dirty page flush stalls
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.vfs_cache_pressure = 50

# Pre-allocate 2048 x 2MB HugePages (4GB pinned physical RAM for ring buffers)
vm.nr_hugepages = 2048
vm.max_map_count = 1048576

# Disable NUMA zone reclaim to avoid memory allocation freezes
vm.zone_reclaim_mode = 0

# ------------------------------------------------------------------------------
# 4. IPC Shared Memory Allocation Limits
# ------------------------------------------------------------------------------
# Maximum shared memory segment size: 64 GB
kernel.shmmax = 68719476736
# Total shared memory pages: 16 GB in 4KB pages
kernel.shmall = 4294967296
kernel.msgmax = 65536
kernel.msgmnb = 65536

# ------------------------------------------------------------------------------
# 5. Kernel Real-Time Scheduling & Jitter Elimination
# ------------------------------------------------------------------------------
# Discourage scheduler from migrating threads across CPU cores
kernel.sched_migration_cost_ns = 5000000
# Disable CFS autogroups to avoid scheduling interference with real-time tasks
kernel.sched_autogroup_enabled = 0
# Disable NMI watchdog interrupts on isolated real-time cores
kernel.nmi_watchdog = 0
