apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "chain-market-price.fullname" . }}-config
  labels:
    {{- include "chain-market-price.labels" . | nindent 4 }}
data:
  cmp-config.toml: |
    [hardware]
    detected_tier = {{ .Values.hardware.tier | quote }}
    recommended_tier = {{ .Values.hardware.tier | quote }}
    cgroup_quota_aware = {{ .Values.hardware.cgroupQuotaAware }}

    [sync]
    wait_strategy = "HybridAdaptive"
    spin_limit = 256
    yield_limit = 1024
    enable_burst_promotion = true

    [shm]
    ring_slots = 16384
    slot_size_bytes = 64
    backend_policy = "CascadeFallback"
