apiVersion: v1
kind: Service
metadata:
  name: {{ include "chain-market-price.fullname" . }}
  labels:
    {{- include "chain-market-price.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.ports.http }}
      targetPort: http-probes
      protocol: TCP
      name: http-probes
    - port: {{ .Values.service.ports.distribution }}
      targetPort: distribution
      protocol: TCP
      name: distribution
  selector:
    {{- include "chain-market-price.selectorLabels" . | nindent 4 }}
