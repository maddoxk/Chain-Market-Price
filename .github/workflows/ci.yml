name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-test:
    name: Check, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Check workspace crates and examples
        run: cargo check --workspace --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace unit tests
        run: cargo test --workspace --all-targets --all-features

      - name: Verify benchmark compilation
        run: cargo check --workspace --benches

  # Optional: talks to the real Coinbase Exchange public feed. Network-dependent, so it can
  # never fail the build; the offline fixture tests above are the real gate.
  live-connect:
    name: Live feed smoke test (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Connect for 20 seconds and require at least 20 messages
        run: |
          cargo run --release -p live-feed --bin live_feed -- \
            --products BTC-USD,ETH-USD --seconds 20 --min-messages 20 | tee live-feed-output.txt
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-feed-output
          path: live-feed-output.txt
