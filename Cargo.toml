[workspace]
resolver = "2"
members = [
    "crates/core-engine",
    "crates/ingest-models",
    "crates/distribution",
    "crates/cefi-ingest",
    "crates/amm-virtualizer",
    "crates/onchain-ingest",
    "crates/live-feed",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
rpath = false
overflow-checks = false
